services:
  db:
    image: postgres:16-alpine
    container_name: bloghub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloghub_user
      POSTGRES_PASSWORD: bloghub_pass_205
      POSTGRES_DB: bloghub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jerney_user -d jerney_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: read-only root filesystem where possible
    tmpfs:
      - /tmp
      - /run

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloghub-backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      DB_USER: bloghub_user
      DB_PASSWORD: bloghub_pass_205
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bloghub_db
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    # Security: do not run as root (already in Dockerfile, but enforced here too)
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloghub-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    driver: local